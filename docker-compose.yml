services:
  mysql:
    image: mysql:8.4
    container_name: examrank-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: examrank
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examrank-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://root:rootpassword@mysql:3306/examrank"
      JWT_SECRET: "examrank-college-super-secret-jwt-key-2026-safe-prod"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NODE_ENV: "production"
    ports:
      - "3000:3000"

volumes:
  mysql_data:
